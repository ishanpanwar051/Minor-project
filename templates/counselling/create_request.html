<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Counselling - EduGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .btn { border-radius: 25px; font-weight: 600; }
        .form-control, .form-select { border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.student_dashboard') }}"><i class="fas fa-graduation-cap"></i> EduGuard AI</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('counselling.student_portal') }}"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="form-card">
                    <h3 class="mb-4"><i class="fas fa-plus-circle text-primary"></i> Request Counselling</h3>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                        {% endfor %}
                    {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('counselling.create_request') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Counselling Type</label>
                            <select name="counselling_type" class="form-select" required>
                                <option value="">Select type...</option>
                                <option value="academic">Academic Guidance</option>
                                <option value="career">Career Counselling</option>
                                <option value="personal">Personal Support</option>
                                <option value="financial">Financial Advice</option>
                                <option value="mental_health">Mental Health</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Topic</label>
                            <input type="text" name="topic" class="form-control" placeholder="Brief topic of your request" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Describe what you'd like to discuss..." required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Priority</label>
                                <select name="priority" class="form-select">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                    <option value="urgent">Urgent</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Preferred Date</label>
                                <input type="date" name="preferred_date" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Preferred Time</label>
                                <select name="preferred_time" class="form-select">
                                    <option value="morning">Morning (9-12)</option>
                                    <option value="afternoon">Afternoon (12-3)</option>
                                    <option value="evening">Evening (3-6)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Duration</label>
                            <select name="duration_minutes" class="form-select">
                                <option value="30">30 minutes</option>
                                <option value="60" selected>60 minutes</option>
                                <option value="90">90 minutes</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Submit Request</button>
                            <a href="{{ url_for('counselling.student_portal') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
